<svg xmlns="http://www.w3.org/2000/svg" width="960" height="252" viewBox="0 0 960 252" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Toolbox</title>
  <desc id="desc">A practical toolset organized into writing code, building interfaces, connecting systems, and shipping software.</desc>
  <defs>
