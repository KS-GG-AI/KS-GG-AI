<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="308" viewBox="0 0 1200 308" fill="none" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="308" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c0919"/>
      <stop offset="50%" stop-color="#121827"/>
      <stop offset="100%" stop-color="#0e1726"/>
    </linearGradient>
    <linearGradient id="neon-line" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="50%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#A7F3D0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1F293D" stroke-width="0.75" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1200" height="308" rx="20" fill="url(#bg)" stroke="#2D3748" stroke-width="1.5"/>
  <rect width="1200" height="308" rx="20" fill="url(#grid)"/>

  <!-- Top and Bottom Circuit Traces -->
  <path d="M 0 54 L 320 54 L 360 84 L 880 84 L 920 54 L 1200 54" stroke="#312E4D" stroke-width="1.2" fill="none" stroke-dasharray="6 6"/>
  <path d="M 0 254 L 280 254 L 320 224 L 840 224 L 880 254 L 1200 254" stroke="#312E4D" stroke-width="1.2" fill="none" stroke-dasharray="6 6"/>
  
  <circle cx="360" cy="84" r="4" fill="#67E8F9" filter="url(#glow)"/>
  <circle cx="880" cy="84" r="4" fill="#A78BFA" filter="url(#glow)"/>
  <circle cx="320" cy="224" r="4" fill="#A7F3D0" filter="url(#glow)"/>
  <circle cx="840" cy="224" r="4" fill="#F472B6" filter="url(#glow)"/>

  <!-- Top Accent Neon Stroke -->
  <line x1="80" y1="2" x2="1120" y2="2" stroke="url(#neon-line)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Right Side Cyber Ambiance -->
  <g transform="translate(1000, 74)">
    <circle cx="60" cy="60" r="90" fill="#7C3AED" fill-opacity="0.12" filter="url(#glow)"/>
    <circle cx="20" cy="80" r="70" fill="#0EA5E9" fill-opacity="0.08" filter="url(#glow)"/>
    <rect x="0" y="0" width="120" height="120" rx="24" fill="none" stroke="#312E4D" stroke-width="1" stroke-dasharray="4 4"/>
    <circle cx="60" cy="60" r="36" fill="none" stroke="#67E8F9" stroke-width="1.5" stroke-dasharray="8 6"/>
    <circle cx="60" cy="60" r="4" fill="#67E8F9" filter="url(#glow)"/>
  </g>

  <!-- Left Content Block -->
  <g transform="translate(60, 40)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="350" height="28" rx="14" fill="#1E1B4B" stroke="#4C1D95" stroke-width="1"/>
    <circle cx="16" cy="14" r="5" fill="#A78BFA" filter="url(#glow)"/>
    <text x="32" y="19" fill="#DDD6FE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">ENTERPRISE HOMELAB APPLIANCE</text>

    <!-- Main Title -->
    <text x="0" y="70" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="35" font-weight="900" letter-spacing="0.5">AdGuard Home High-Performance Stack</text>

    <!-- Subtitle -->
    <text x="0" y="104" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="500">
      Hardened Standalone Multi-Node Architecture · Fast Failover · Zero-SPOF
    </text>

    <!-- Feature Chips (5 horizontally across) -->
    <g transform="translate(0, 130)">
      <g transform="translate(0, 0)">
        <rect width="170" height="32" rx="8" fill="#132038" stroke="#0284C7" stroke-width="1.2"/>
        <text x="14" y="20" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">⚡ HTTP/2 &amp; HTTP/3</text>
      </g>
      <g transform="translate(182, 0)">
        <rect width="165" height="32" rx="8" fill="#201533" stroke="#9333EA" stroke-width="1.2"/>
        <text x="14" y="20" fill="#C084FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">🚀 ZRAM + TCP BBR</text>
      </g>
      <g transform="translate(359, 0)">
        <rect width="175" height="32" rx="8" fill="#0C2924" stroke="#059669" stroke-width="1.2"/>
        <text x="14" y="20" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">🔒 20-Year TLS SAN</text>
      </g>
      <g transform="translate(546, 0)">
        <rect width="185" height="32" rx="8" fill="#2E1224" stroke="#DB2777" stroke-width="1.2"/>
        <text x="14" y="20" fill="#F472B6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">🌐 2.5GbE Dual-NIC Pod</text>
      </g>
      <g transform="translate(743, 0)">
        <rect width="170" height="32" rx="8" fill="#1C1E33" stroke="#6366F1" stroke-width="1.2"/>
        <text x="14" y="20" fill="#818CF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">🛡️ ByeDPI + PAC 8088</text>
      </g>
    </g>

    <!-- Performance Footer -->
    <g transform="translate(0, 192)">
      <text x="0" y="14" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">
        <tspan fill="#67E8F9">0ms</tspan> Local Loopback · <tspan fill="#A78BFA">1s</tspan> Instant Failover · <tspan fill="#A7F3D0">7.5MB</tspan> UDP Buffers · <tspan fill="#F472B6">1~2</tspan> vCPU
      </text>
    </g>
  </g>
</svg>