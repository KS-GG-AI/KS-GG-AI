<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Profile languages</title>
  <desc id="desc">The profile is available in English, Korean, Chinese, Spanish, Hindi, Arabic, Portuguese, Russian, French, and Indonesian.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="960" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#151126"/>
      <stop offset=".55" stop-color="#0E1824"/>
      <stop offset="1" stop-color="#10211E"/>
    </linearGradient>
    <linearGradient id="highlight" x1="28" y1="0" x2="370" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA" stop-opacity=".28"/>
      <stop offset="1" stop-color="#67E8F9" stop-opacity=".22"/>
    </linearGradient>
  </defs>
  <rect x=".5" y=".5" width="959" height="239" rx="22" fill="url(#surface)" stroke="#30394D"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="30" y="39" fill="#F5F3FF" font-size="18" font-weight="700">PROFILE LANGUAGES</text>
    <text x="30" y="61" fill="#AAA6BD" font-size="11" letter-spacing=".7">10 LOCALIZED VIEWS · ONE SHARED CONTEXT</text>
    <rect x="770" y="23" width="162" height="30" rx="15" fill="#111C27" stroke="#33455B"/>
    <circle cx="790" cy="38" r="4" fill="#A7F3D0"/>
    <text x="805" y="42" fill="#D8E8E6" font-size="10" font-weight="700">10 VIEWS LIVE</text>
    <path d="M28 78H932" stroke="#67E8F9" stroke-opacity=".35"/>

    <rect x="28" y="98" width="164" height="32" rx="10" fill="url(#highlight)" stroke="#7C6CA9"/>
    <text x="46" y="119" fill="#E5DFFF" font-size="11" font-weight="700">KOREAN</text>
    <rect x="208" y="98" width="164" height="32" rx="10" fill="url(#highlight)" stroke="#5A8292"/>
    <text x="226" y="119" fill="#D6F5FF" font-size="11" font-weight="700">ENGLISH</text>
    <rect x="388" y="98" width="164" height="32" rx="10" fill="#17212C" stroke="#35465A"/>
    <text x="406" y="119" fill="#C9D9EF" font-size="11" font-weight="700">CHINESE</text>
    <rect x="568" y="98" width="164" height="32" rx="10" fill="#1B1C2C" stroke="#45425C"/>
    <text x="586" y="119" fill="#DCD7FC" font-size="11" font-weight="700">SPANISH</text>
    <rect x="748" y="98" width="164" height="32" rx="10" fill="#17251F" stroke="#365249"/>
    <text x="766" y="119" fill="#C7F1D5" font-size="11" font-weight="700">HINDI</text>

    <rect x="28" y="146" width="164" height="32" rx="10" fill="#211920" stroke="#58414D"/>
    <text x="46" y="167" fill="#F3D4E4" font-size="11" font-weight="700">ARABIC</text>
    <rect x="208" y="146" width="164" height="32" rx="10" fill="#17252A" stroke="#335A63"/>
    <text x="226" y="167" fill="#C5F0F5" font-size="11" font-weight="700">PORTUGUESE</text>
    <rect x="388" y="146" width="164" height="32" rx="10" fill="#20202A" stroke="#4B4B5B"/>
    <text x="406" y="167" fill="#E0E0EA" font-size="11" font-weight="700">RUSSIAN</text>
    <rect x="568" y="146" width="164" height="32" rx="10" fill="#282018" stroke="#5A4C36"/>
    <text x="586" y="167" fill="#F5E0BC" font-size="11" font-weight="700">FRENCH</text>
    <rect x="748" y="146" width="164" height="32" rx="10" fill="#17281F" stroke="#385A49"/>
    <text x="766" y="167" fill="#C9F2D4" font-size="11" font-weight="700">INDONESIAN</text>

    <text x="30" y="212" fill="#BCB5D6" font-size="10" letter-spacing=".45">KOREAN + ENGLISH START THE PROFILE</text>
    <text x="510" y="212" fill="#9FB8B4" font-size="10" letter-spacing=".45">EIGHT MORE VIEWS MAKE IT EASIER TO SHARE</text>
  </g>
</svg>
