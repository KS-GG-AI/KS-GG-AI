<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">AdGuard Home High-Performance Homelab Stack Banner</title>
  <desc id="desc">Hardened multi-node appliance with ZRAM, TCP BBR, HTTP/2 and HTTP/3 QUIC, and 2.5GbE network isolation</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c0919"/>
      <stop offset="50%" stop-color="#121827"/>
      <stop offset="100%" stop-color="#0e1726"/>
    </linearGradient>
    <linearGradient id="neon-line" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="50%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#A7F3D0"/>
    </linearGradient>
    <linearGradient id="shield-glow" x1="120" y1="70" x2="220" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1F293D" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background Base & Grid -->
  <rect width="1200" height="360" rx="20" fill="url(#bg)" stroke="#2D3748" stroke-width="1.5"/>
  <rect width="1200" height="360" rx="20" fill="url(#grid)"/>

  <!-- Circuit Accents -->
  <path d="M 0 60 L 320 60 L 360 100 L 840 100 L 880 60 L 1200 60" stroke="#312E4D" stroke-width="1.5" fill="none" stroke-dasharray="6 6"/>
  <path d="M 0 300 L 280 300 L 320 260 L 880 260 L 920 300 L 1200 300" stroke="#312E4D" stroke-width="1.5" fill="none" stroke-dasharray="6 6"/>
  
  <circle cx="360" cy="100" r="4" fill="#67E8F9" filter="url(#glow)"/>
  <circle cx="840" cy="100" r="4" fill="#A78BFA" filter="url(#glow)"/>
  <circle cx="320" cy="260" r="4" fill="#A7F3D0" filter="url(#glow)"/>
  <circle cx="880" cy="260" r="4" fill="#F472B6" filter="url(#glow)"/>

  <!-- Top Ambient Glow -->
  <line x1="120" y1="2" x2="1080" y2="2" stroke="url(#neon-line)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Center Content Group -->
  <g transform="translate(60, 0)">
    <!-- Icon / Shield Graphic -->
    <g transform="translate(40, 75)">
      <path d="M 60 10 L 110 30 V 90 C 110 140 60 170 60 170 C 60 170 10 140 10 90 V 30 Z" fill="#1E293B" stroke="url(#shield-glow)" stroke-width="3.5" filter="url(#glow)"/>
      <path d="M 60 25 L 98 42 V 88 C 98 128 60 152 60 152 C 60 152 22 128 22 88 V 42 Z" fill="#0F172A" stroke="#67E8F9" stroke-width="1.5" stroke-opacity="0.6"/>
      <path d="M 40 85 L 54 100 L 82 66" stroke="#67E8F9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
      <circle cx="60" cy="115" r="3" fill="#A78BFA"/>
      <circle cx="45" cy="55" r="2.5" fill="#A7F3D0"/>
      <circle cx="75" cy="55" r="2.5" fill="#A7F3D0"/>
    </g>

    <!-- Header Text Block -->
    <g transform="translate(200, 70)">
      <rect x="0" y="0" width="365" height="28" rx="14" fill="#1E1B4B" stroke="#4C1D95" stroke-width="1"/>
      <circle cx="16" cy="14" r="5" fill="#A78BFA" filter="url(#glow)"/>
      <text x="32" y="19" fill="#DDD6FE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">ENTERPRISE HOMELAB APPLIANCE</text>

      <text x="0" y="72" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" letter-spacing="0.5">AdGuard Home High-Performance Stack</text>

      <text x="0" y="106" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">
        Hardened Standalone Multi-Node Architecture · Fast Failover · Zero-SPOF
      </text>

      <!-- Tech Feature Chips -->
      <g transform="translate(0, 130)">
        <g transform="translate(0, 0)">
          <rect width="160" height="32" rx="8" fill="#132038" stroke="#0284C7" stroke-width="1.2"/>
          <text x="14" y="20" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">⚡ HTTP/2 &amp; HTTP/3</text>
        </g>
        <g transform="translate(172, 0)">
          <rect width="150" height="32" rx="8" fill="#201533" stroke="#9333EA" stroke-width="1.2"/>
          <text x="14" y="20" fill="#C084FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">🚀 ZRAM + TCP BBR</text>
        </g>
        <g transform="translate(334, 0)">
          <rect width="140" height="32" rx="8" fill="#0C2924" stroke="#059669" stroke-width="1.2"/>
          <text x="14" y="20" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">🔒 20-Year TLS SAN</text>
        </g>
        <g transform="translate(486, 0)">
          <rect width="165" height="32" rx="8" fill="#2E1224" stroke="#DB2777" stroke-width="1.2"/>
          <text x="14" y="20" fill="#F472B6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">🌐 2.5GbE Dual-NIC Pod</text>
        </g>
        <g transform="translate(663, 0)">
          <rect width="155" height="32" rx="8" fill="#1C1E33" stroke="#6366F1" stroke-width="1.2"/>
          <text x="14" y="20" fill="#818CF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">🛡️ ByeDPI + PAC 8088</text>
        </g>
      </g>

      <g transform="translate(0, 184)">
        <text x="0" y="14" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
          <tspan fill="#67E8F9">0ms</tspan> Local Loopback · <tspan fill="#A78BFA">1s</tspan> Instant Failover · <tspan fill="#A7F3D0">7.5MB</tspan> UDP Buffers · <tspan fill="#F472B6">10</tspan> Locales Parity
        </text>
      </g>
    </g>
  </g>
</svg>