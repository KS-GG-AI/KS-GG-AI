      <stop stop-color="#14111F"/>
      <stop offset=".55" stop-color="#101720"/>
      <stop offset="1" stop-color="#0D1919"/>
    </linearGradient>
    <linearGradient id="rule" x1="28" y1="0" x2="932" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA" stop-opacity=".7"/>
      <stop offset=".52" stop-color="#67E8F9" stop-opacity=".55"/>
      <stop offset="1" stop-color="#A7F3D0" stop-opacity=".5"/>
    </linearGradient>
  </defs>
  <rect x=".5" y=".5" width="959" height="251" rx="22" fill="url(#surface)" stroke="#31364A"/>
  <path d="M28 76H932" stroke="url(#rule)" stroke-width="1.25"/>
