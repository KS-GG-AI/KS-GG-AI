    <rect x="270" y="150" width="150" height="22" rx="7" fill="#173124"/><text x="281" y="165" fill="#C9F6D4" font-size="10" font-weight="700">Node.js</text>
    <rect x="270" y="176" width="150" height="22" rx="7" fill="#19323A"/><text x="281" y="191" fill="#BDEFFF" font-size="10" font-weight="700">React</text>
